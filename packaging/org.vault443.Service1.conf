<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.vault443.Service1"/></policy>
  <!-- Every method authenticates the sender UID, current operator membership,
       local active session, session ownership and admin rights in the daemon. -->
  <policy context="default">
    <allow send_destination="org.vault443.Service1"/>
    <allow receive_sender="org.vault443.Service1"/>
  </policy>
</busconfig>
